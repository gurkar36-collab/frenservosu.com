<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şasi No ve Araç Seçici Filtre Paneli</title>
  <style>
    :root {
      --primary-blue: #0f2b5c;
      --accent-orange: #f38218;
      --bg-gray: #f4f6f9;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-gray);
    }

    .hero-selector-section {
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
    }

    .vin-search-card {
      background: var(--primary-blue);
      color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .vin-search-card h2 {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      background: #ffffff;
      border-radius: 8px;
      padding: 4px;
    }

    .input-group input {
      flex: 1;
      border: none;
      padding: 12px;
      outline: none;
      font-size: 0.9rem;
    }

    .btn-primary {
      background-color: var(--accent-orange);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #d96f0f;
    }

    .vehicle-select-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .vehicle-select-card h3 {
      font-size: 1rem;
      color: #333333;
      margin-bottom: 15px;
    }

    .select-step {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .select-step select {
      width: 100%;
      padding: 12px;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.9rem;
      color: #444444;
      cursor: pointer;
    }

    .select-step select:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: var(--primary-blue);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s ease;
    }

    .btn-secondary:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    .car-box {
      width: 100%;
      height: 300px;
      background: #0f2b5c;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <section class="hero-selector-section">
    <div class="container">
      <div class="hero-grid">
        
        <div class="search-panels">
          <div class="vin-search-card">
            <h2>Şasi No ile Fren Servosu Ara</h2>
            <form id="vinSearchForm" class="vin-form">
              <div class="input-group">
                <input type="text" id="vinInput" maxlength="17" placeholder="Aracınızın 17 haneli Şasi Numarasını (VIN) giriniz..." required>
                <button type="submit" class="btn-primary">BUL</button>
              </div>
            </form>
          </div>

          <div class="vehicle-select-card">
            <h3>ARACINIZI SEÇİN</h3>
            <form id="vehicleSelectForm">
              
              <div class="select-step">
                <select id="selectBrand" required>
                  <option value="">1. Marka Seçin</option>
                  <option value="audi">Audi</option>
                  <option value="bmw">BMW</option>
                  <option value="mercedes">Mercedes-Benz</option>
                  <option value="volkswagen">Volkswagen</option>
                </select>
              </div>

              <div class="select-step">
                <select id="selectModel" disabled required>
                  <option value="">2. Model Seçin...</option>
                </select>
              </div>

              <div class="select-step">
                <select id="selectYear" disabled required>
                  <option value="">3. Yıl</option>
                </select>
              </div>

              <div class="select-step">
                <select id="selectEngine" disabled required>
                  <option value="">4. Motor Seçin...</option>
                </select>
              </div>

              <div class="select-step">
                <select id="selectGear" disabled required>
                  <option value="">5. Şanzıman</option>
                </select>
              </div>

              <button type="submit" id="btnFilterParts" class="btn-secondary" disabled>UYGUN PARÇALARI LİSTELE</button>
            </form>
          </div>
        </div>

        <div class="hero-image-container">
          <div class="car-box">Frenservosu.com Uyumlu Araç Filtresi</div>
        </div>

      </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const vehicleData = {
        audi: {
          models: {
            'A3': { years: ['2018', '2019', '2020'], engines: ['1.6 TDI', '1.5 TFSI'], gears: ['Otomatik', 'Manuel'] },
            'A4': { years: ['2016', '2017', '2018', '2019'], engines: ['2.0 TDI'], gears: ['Otomatik'] }
          }
        },
        bmw: {
          models: {
            '3 Series': { years: ['2015', '2016', '2017'], engines: ['320i 1.6', '320d 2.0'], gears: ['Otomatik'] }
          }
        }
      };

      const brandSelect = document.getElementById('selectBrand');
      const modelSelect = document.getElementById('selectModel');
      const yearSelect = document.getElementById('selectYear');
      const engineSelect = document.getElementById('selectEngine');
      const gearSelect = document.getElementById('selectGear');
      const filterBtn = document.getElementById('btnFilterParts');

      brandSelect.addEventListener('change', (e) => {
        const brand = e.target.value;
        modelSelect.innerHTML = '<option value="">2. Model Seçin...</option>';
        resetDropdowns([yearSelect, engineSelect, gearSelect]);

        if (brand && vehicleData[brand]) {
          modelSelect.disabled = false;
          Object.keys(vehicleData[brand].models).forEach(model => {
            modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
          });
        } else {
          modelSelect.disabled = true;
        }
      });

      modelSelect.addEventListener('change', (e) => {
        const brand = brandSelect.value;
        const model = e.target.value;
        yearSelect.innerHTML = '<option value="">3. Yıl</option>';
        resetDropdowns([engineSelect, gearSelect]);

        if (model && vehicleData[brand].models[model]) {
          yearSelect.disabled = false;
          vehicleData[brand].models[model].years.forEach(year => {
            yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
          });
        }
      });

      yearSelect.addEventListener('change', () => {
        const brand = brandSelect.value;
        const model = modelSelect.value;
        engineSelect.innerHTML = '<option value="">4. Motor Seçin...</option>';
        resetDropdowns([gearSelect]);

        if (yearSelect.value) {
          engineSelect.disabled = false;
          vehicleData[brand].models[model].engines.forEach(engine => {
            engineSelect.innerHTML += `<option value="${engine}">${engine}</option>`;
          });
        }
      });

      engineSelect.addEventListener('change', () => {
        const brand = brandSelect.value;
        const model = modelSelect.value;
        gearSelect.innerHTML = '<option value="">5. Şanzıman</option>';

        if (engineSelect.value) {
          gearSelect.disabled = false;
          vehicleData[brand].models[model].gears.forEach(gear => {
            gearSelect.innerHTML += `<option value="${gear}">${gear}</option>`;
          });
        }
      });

      gearSelect.addEventListener('change', () => {
        filterBtn.disabled = !gearSelect.value;
      });

      function resetDropdowns(dropdowns) {
        dropdowns.forEach(select => {
          select.disabled = true;
          select.selectedIndex = 0;
        });
        filterBtn.disabled = true;
      }

      document.getElementById('vinSearchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const vin = document.getElementById('vinInput').value.trim();
        if (vin.length === 17) {
          window.location.href = `/arama?vin=${encodeURIComponent(vin)}`;
        } else {
          alert('Lütfen geçerli 17 haneli Şasi No (VIN) giriniz.');
        }
      });
    });
  </script>
</body>
</html>
