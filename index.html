<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com - powered by xparca.com</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0b2341;
            --accent-orange: #f26522;
            --light-bg: #f4f6f8;
            --border-color: #dcdfe6;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
        }

        /* Top Bar & Header */
        header {
            background-color: #ffffff;
            border-bottom: 2px solid #e5e5e5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 32px;
            color: var(--accent-orange);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text h1 {
            font-size: 24px;
            color: var(--primary-blue);
            font-weight: 800;
            line-height: 1;
        }

        .logo-text span {
            font-size: 11px;
            color: #777;
            margin-top: 3px;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .user-nav a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Navigation Bar */
        nav {
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .categories-btn {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-blue);
            text-transform: uppercase;
        }

        /* Hero Banner Section */
        .hero-section {
            background: linear-gradient(135deg, #0b2341 0%, #1a3a60 60%, #001226 100%);
            color: white;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            position: relative;
            z-index: 2;
        }

        /* VIN & Vehicle Selector Box */
        .search-box-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .vin-box {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .vin-title {
            background-color: var(--primary-blue);
            color: white;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 12px;
        }

        .vin-input-group {
            display: flex;
            gap: 5px;
        }

        .vin-input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
        }

        .vin-input-group button {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .vehicle-select-box {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            color: var(--text-dark);
        }

        .select-header {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary-blue);
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .select-group {
            margin-bottom: 8px;
        }

        .select-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            background-color: #fafafa;
        }

        /* Banner Main Area */
        .hero-banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero-banner img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        /* Features Ribbon */
        .features-bar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .features-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--primary-blue);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-item i {
            font-size: 18px;
            color: var(--accent-orange);
        }

        /* Categories Section */
        .categories-section {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .category-card {
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
