<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com | Orijinal Arayüz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #ffffff; }

        /* Üst Menü Alanı */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: #fff;
            border-bottom: 1px solid #e1e8ed;
        }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 35px; height: 35px; background: #123d6b; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .logo-text { font-size: 22px; font-weight: bold; color: #0f294a; }
        .logo-text span { color: #555; font-size: 12px; font-weight: normal; margin-left: 5px; }
        
        .main-menu { display: flex; list-style: none; gap: 20px; font-size: 13px; font-weight: bold; color: #444; }
        .main-menu li { cursor: pointer; }
        .user-actions { font-size: 13px; font-weight: bold; color: #333; }

        /* Ana Görsel ve Seçim Alanı (Lacivert Kuşak) */
        .hero-banner {
            background-color: #0d233a;
            padding: 40px 5%;
            display: flex;
            justify-content: center;
        }
        .hero-wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }

        /* Sol Taraf: Arama Formları */
        .forms-container { width: 440px; }

        /* Üstteki Şasi No Girişi */
        .vin-search-box {
            background: #153152;
            border: 1px solid #204673;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .vin-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        .vin-input-row { display: flex; background: #fff; border-radius: 4px; padding: 3px; }
        .vin-input-row input {
            flex: 1; border: none; padding: 10px; font-size: 13px; outline: none;
        }
        .vin-submit-btn {
            background: #ff9900; color: white; border: none; padding: 0 25px;
            font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;
        }

        /* Alttaki Aracınızı Seçin Formu */
        .vehicle-select-box {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .box-header-title {
            font-size: 12px; font-weight: bold; color: #0d233a;
            margin-bottom: 15px; text-transform: uppercase;
        }
        .input-row { margin-bottom: 10px; }
        .input-row select {
            width: 100%; padding: 10px 12px; border: 1px solid #cccccc;
            border-radius: 4px; background: #ffffff; color: #555;
            font-size: 13px; outline: none; cursor: pointer;
        }

        /* Sağ Taraf: Orijinal Araba ve Fren Parçası Düzeni */
        .display-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            height: 380px;
        }
        /* Görseldeki gri araba düzeni */
        .bg-car {
            width: 580px;
            height: auto;
            opacity: 0.9;
        }
        /* Arabanın önündeki parlayan parça dairesi */
        .floating-part {
            position: absolute;
            left: 5%;
            top: 15%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(0,242,254,0.3) 0%, rgba(0,0,0,0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .part-graphic {
            width: 140px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.8));
        }

        /* En Alttaki 4'lü Özellik Çubuğu */
        .info-ribbon {
            display: flex;
            justify-content: space-around;
            background: #f4f7fa;
            padding: 15px 5%;
            border-bottom: 1px solid #e1e8ed;
        }
        .ribbon-cell { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; color: #2c3e50; }
        .ribbon-dot { width: 6px; height: 6px; background: #ff9900; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- Sitenin Üst Menüsü -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">⚙️</div>
            <div class="logo-text">frenservosu.com <span>powered by xparca.com</span></div>
        </div>
        <ul class="main-menu">
            <li>KATEGORİLER</li>
            <li>MARKALAR</li>
            <li>AVANTAJLARA BAKIŞ</li>
            <li>BLOG</li>
            <li>İLETİŞİM</li>
            <li>FİRMA PROFİLİ</li>
        </ul>
        <div class="user-actions">👤 HESABIM &nbsp;&nbsp; 🛒 SEPETİM</div>
    </header>

    <!-- Ana Panel (Görseldeki Alan) -->
    <section class="hero-banner">
        <div class="hero-wrapper">
            
            <!-- Sol Form Bölümü -->
            <div class="forms-container">
                <!-- 1. Şasi No ile Ara -->
                <div class="vin-search-box">
                    <div class="vin-title">Şasi No ile Fren Servosu Ara</div>
                    <div class="vin-input-row">
                        <input type="text" placeholder="Aracınızın 17 haneli Şasi Numarasını (VIN) giriniz...">
                        <button class="vin-submit-btn">BUL</button>
                    </div>
                </div>

                <!-- 2. Aracınızı Seçin -->
                <div class="vehicle-select-box">
                    <div class="box-header-title">ARACINIZI SEÇİN</div>
                    <div class="input-row"><select><option>1. Marka</option></select></div>
                    <div class="input-row"><select disabled><option>2. Model Seçin...</option></select></div>
                    <div class="input-row"><select disabled><option>3. Yıl</option></select></div>
                    <div class="input-row"><select disabled><option>4. Motor Seçin...</option></select></div>
                    <div class="input-row"><select disabled><option>5. Şanzıman</option></select></div>
                </div>
            </div>

            <!-- Sağ Görsel Bölümü -->
            <div class="display-container">
                <!-- Mavi ışık efektli ve parça grafiği içeren alan -->
                <div class="floating-part">
                    <img src="https://flaticon.com" class="part-graphic" alt="Servo Parçası">
                </div>
                <!-- Arka plandaki modern araç çizgisi -->
                <img src="https://pngplay.com" class="bg-car" alt="Araç">
            </div>

        </div>
    </section>

    <!-- Alt Çizgi Menüsü -->
    <div class="info-ribbon">
        <div class="ribbon-cell"><div class="ribbon-dot"></div> ORİJİNAL VE GARANTİLİ ÜRÜNLER</div>
        <div class="ribbon-cell"><div class="ribbon-dot"></div> HIZLI VE ÜCRETSİZ KARGO</div>
        <div class="ribbon-cell"><div class="ribbon-dot"></div> UZMAN TEKNİK DESTEK</div>
        <div class="ribbon-cell"><div class="ribbon-dot"></div> KOLAY İADE</div>
    </div>

</body>
</html>
