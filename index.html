<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com - powered by xparca.com</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #dce3ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Ana Ekran Konteyneri (Monitör İçi Birebir Arayüz) */
        .site-wrapper {
            width: 100%;
            max-width: 1200px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        /* 1. ÜST HEADER BAR */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            background-color: #ffffff;
            border-bottom: 1px solid #e1e8ed;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            font-size: 26px;
            color: #1a365d;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            color: #1a365d;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 11px;
            color: #555;
            font-weight: bold;
        }

        .logo-sub span {
            color: #1a365d;
        }

        .header-menu {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .header-menu a {
            text-decoration: none;
            color: #2c3e50;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .header-menu .dropdown::after {
            content: ' \f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
        }

        .header-user {
            display: flex;
            gap: 15px;
            font-size: 11px;
            font-weight: 700;
            color: #1a365d;
        }

        .header-user div {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 2. HERO / KOYU MAVİ BANNER ALANI */
        .hero-banner {
            background: linear-gradient(135deg, #091e3a 0%, #112d55 50%, #1a3e6d 100%);
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            position: relative;
            min-height: 380px;
        }

        .hero-left {
            width: 360px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Şasi No Kutusu */
        .chassis-card {
            background-color: #0d274c;
            border: 1px solid #1e4173;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
        }

        .chassis-card h2 {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .chassis-input-group {
            display: flex;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            padding: 2px;
        }

        .chassis-input-group input {
            border: none;
            outline: none;
            padding: 6px 10px;
            flex: 1;
            font-size: 11px;
            color: #666;
        }

        .btn-bul {
            background: #f39c12;
            color: #ffffff;
            border: none;
            padding: 6px 18px;
            font-weight: 800;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Araç Seçim Paneli */
        .vehicle-select-card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 12px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .vehicle-title {
            font-size: 11px;
            font-weight: 800;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .select-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .select-box {
            display: flex;
            align-items: center;
            border: 1px solid #cccccc;
            border-radius: 5px;
            padding: 5px 8px;
            background: #fff;
        }

        .select-box i {
            color: #1a365d;
            font-size: 13px;
            width: 22px;
        }

        .select-box select {
            border: none;
            outline: none;
            width: 100%;
            font-size: 11px;
            color: #444;
            font-weight: 600;
            background: transparent;
        }

        /* Görsel Alanı (Sağ Taraf) */
        .hero-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-car-render {
            max-width: 90%;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* 3. ÖZELLİK VE AVANTAJ BARI */
        .features-strip {
            background-color: #eef2f6;
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            border-bottom: 1px solid #dcdcdc;
        }

        .feature-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            color: #1a365d;
        }

        .feature-box i {
            font-size: 16px;
        }

        /* 4. ALT KATEGORİ VE ROZET GRIDİ */
        .grid-section {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            padding: 15px 25px;
            background-color: #ffffff;
        }
