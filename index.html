<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com - powered by xparca.com</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
        }

        /* Top Header Navigation */
        .top-nav {
            background-color: #ffffff;
            border-bottom: 1px solid #e1e5eb;
            padding: 12px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #1b365d, #0d1e36);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f39c12;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #1b365d;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 11px;
            color: #666;
            font-weight: 600;
            margin-left: 2px;
        }

        .logo-sub span {
            color: #1b365d;
            font-weight: 700;
        }

        .main-menu {
            display: flex;
            align-items: center;
            gap: 24px;
            list-style: none;
        }

        .main-menu a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .main-menu a.dropdown::after {
            content: ' \f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-left: 4px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 12px;
            font-weight: 700;
            color: #1b365d;
        }

        .user-actions div {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Hero Banner Section */
        .hero-section {
            background: linear-gradient(110deg, #0d2342 0%, #163660 45%, #2a5288 100%);
            position: relative;
            padding: 30px 5% 40px 5%;
            overflow: hidden;
            min-height: 400px;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            position: relative;
            z-index: 2;
        }

        .search-column {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Şasi No Box */
        .chassis-box {
            background-color: #0b1a30;
            border: 1px solid #234574;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .chassis-box h3 {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 700;
            text-align: center;
        }

        .input-group {
            display: flex;
            background: #ffffff;
            border-radius: 6px;
            padding: 3px;
        }

        .input-group input {
            border: none;
            outline: none;
            padding: 8px 12px;
            flex: 1;
            font-size: 12px;
            border-radius: 4px;
        }

        .btn-search {
            background: linear-gradient(to bottom, #f39c12, #e67e22);
            color: white;
            border: none;
            padding: 8px 18px;
            font-weight: 800;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Vehicle Selector Box */
        .vehicle-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .vehicle-box-title {
            font-size: 13px;
            font-weight: 800;
            color: #1b365d;
            border-bottom: 2px solid #e1e5eb;
            padding-bottom: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-item {
            display: flex;
            align-items: center;
            border: 1px solid #cccccc;
            border-radius: 6px;
            padding: 6px 10px;
            background: #fdfdfd;
        }

        .select-item i {
            color: #1b365d;
            width: 20px;
            font-size: 14px;
        }

        .select-item select {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 12px;
            color: #555;
            font-weight: 600;
            cursor: pointer;
        }

        /* Hero Visual Right Side */
        .visual-column {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Feature Badges Bar */
        .features-bar {
            background-color: #eef2f5;
            border-bottom: 1px solid #dce2e8;
            padding: 12px 5%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 800;
            color: #1b365d;
            text-transform: uppercase;
        }

        .feature-item i {
            font-size: 18px;
            color: #1b365d;
        }

        /* Bottom Grid Section */
        .bottom-section {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }
