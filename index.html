<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com - powered by xparca.com</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0B1B3D',
                            900: '#07132B',
                        },
                        brandOrange: '#F39C12',
                        brandOrangeHover: '#E67E22',
                        customGray: '#F4F6F8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-200 text-gray-800 font-sans antialiased min-h-screen flex justify-center items-start py-6">

    <!-- ANA KONTEYNER (WEBSITE EKRANI) -->
    <div class="w-full max-w-[1240px] bg-white shadow-2xl rounded-md overflow-hidden border border-gray-300">
        
        <!-- 1. HEADER (ÜST MENÜ) -->
        <header class="bg-white border-b border-gray-200 px-6 py-3 flex flex-wrap items-center justify-between text-xs font-bold">
            <!-- LOGO ALANI -->
            <div class="flex items-center gap-3">
                <div class="relative w-8 h-8 flex items-center justify-center">
                    <i class="fa-solid fa-gear text-navy-800 text-3xl"></i>
                    <i class="fa-solid fa-xmark text-brandOrange text-lg absolute"></i>
                </div>
                <div>
                    <div class="text-xl font-extrabold text-navy-800 tracking-tight leading-none">frenservosu.com</div>
                    <div class="text-[10px] text-gray-500 font-medium">powered by <span class="text-navy-800 font-bold">xparca.com</span></div>
                </div>
            </div>

            <!-- KATEGORİ VE MENÜ LİNKLERİ -->
            <nav class="hidden lg:flex items-center gap-6 uppercase tracking-wider text-gray-700">
                <a href="#" class="flex items-center gap-1.5 hover:text-navy-800"><i class="fa-solid fa-bars"></i> KATEGORİLER <i class="fa-solid fa-chevron-down text-[9px] ml-0.5"></i></a>
                <a href="#" class="hover:text-navy-800">MARKALAR</a>
                <a href="#" class="hover:text-navy-800">AVANTAJLARA BAKIŞ</a>
                <a href="#" class="hover:text-navy-800">BLOG</a>
                <a href="#" class="hover:text-navy-800">İLETİŞİM</a>
                <a href="#" class="hover:text-navy-800">FİRMA PROFİLİ</a>
            </nav>

            <!-- KULLANICI AKSİYONLARI -->
            <div class="flex items-center gap-4 text-navy-800">
                <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80">
                    <i class="fa-regular fa-user text-sm"></i> HESABIM
                </div>
                <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80">
                    <i class="fa-solid fa-cart-shopping text-sm"></i> SEPETİM
                </div>
                <div class="flex items-center gap-1 cursor-pointer hover:opacity-80 border-l border-gray-300 pl-3">
                    TR <i class="fa-solid fa-chevron-down text-[9px]"></i>
                </div>
            </div>
        </header>

        <!-- 2. HERO / KOYU MAVİ BANNER ALANI -->
        <section class="bg-gradient-to-r from-navy-900 via-navy-800 to-slate-800 relative px-6 py-6 flex flex-col lg:flex-row gap-6 min-h-[380px] overflow-hidden">
            
            <!-- SOL FORM ALANI -->
            <div class="w-full lg:w-[380px] z-10 flex flex-col gap-3">
                
                <!-- Şasi No İle Arama Kartı -->
                <div class="bg-navy-900 border border-slate-700 rounded-xl p-4 text-center shadow-lg">
                    <h2 class="text-white text-base font-bold mb-2">Şasi No ile Fren Servosu Ara</h2>
                    <div class="flex bg-white rounded-md p-0.5 shadow-inner">
                        <div class="flex items-center justify-center pl-2 text-gray-400">
                            <i class="fa-solid fa-circle-info text-sm"></i>
                        </div>
                        <input type="text" placeholder="Aracınızın 17 haneli Şasi Numarasını (VIN) giriniz..." class="w-full text-[11px] px-2 py-1.5 text-gray-700 outline-none">
                        <button class="bg-gradient-to-b from-brandOrange to-brandOrangeHover text-white font-extrabold text-xs px-5 py-1.5 rounded uppercase hover:brightness-105 transition">BUL</button>
                    </div>
                </div>

                <!-- Aracınızı Seçin Kartı -->
                <div class="bg-white rounded-xl p-3 shadow-xl border border-gray-100">
                    <fieldset class="border border-gray-300 rounded-lg p-2.5 pt-0">
                        <legend class="px-2 text-[11px] font-extrabold text-navy-800 tracking-wider">ARACINIZI SEÇİN</legend>
                        <div class="flex flex-col gap-2 mt-1">
                            
                            <div class="flex items-center border border-gray-300 rounded px-2 py-1 bg-white">
                                <i class="fa-solid fa-car text-navy-800 text-xs w-5"></i>
                                <select class="w-full text-xs font-semibold text-gray-600 bg-transparent outline-none cursor-pointer">
                                    <option>1. Marka</option>
                                </select>
                            </div>

                            <div class="flex items-center border border-gray-300 rounded px-2 py-1 bg-white">
                                <i class="fa-solid fa-car-side text-navy-800 text-xs w-5"></i>
                                <select class="w-full text-xs font-semibold text-gray-600 bg-transparent outline-none cursor-pointer">
                                    <option>2. Model Seçin...</option>
                                </select>
                            </div>

                            <div class="flex items-center border border-gray-300 rounded px-2 py-1 bg-white">
                                <i class="fa-solid fa-calendar-days text-navy-800 text-xs w-5"></i>
                                <select class="w-full text-xs font-semibold text-gray-600 bg-transparent outline-none cursor-pointer">
                                    <option>3. Yıl</option>
                                </select>
                            </div>

                            <div class="flex items-center border border-gray-300 rounded px-2 py-1 bg-white">
                                <i class="fa-solid fa-gears text-navy-800 text-xs w-5"></i>
                                <select class="w-full text-xs font-semibold text-gray-600 bg-transparent outline-none cursor-pointer">
                                    <option>4. Motor Seçin...</option>
                                </select>
                            </div>

                            <div class="flex items-center border border-gray-300 rounded px-2 py-1 bg-white">
                                <i class="fa-solid fa-sliders text-navy-800 text-xs w-5"></i>
                                <select class="w-full text-xs font-semibold text-gray-600 bg-transparent outline-none cursor-pointer">
                                    <option>5. Şanzıman</option>
                                </select>
                            </div>

                        </div>
                    </fieldset>
                </div>

            </div>

            <!-- SAĞ GÖRSEL ALANI -->
            <div class="flex-1 flex items-center justify-center relative min-h-[250px]">
                <div class="relative w-full h-full flex items-center justify-center">
                    <!-- Dahili Vektörel Araba ve Fren Servosu Görseli (Görsele tam sadık tasarım) -->
                    <svg class="w-full max-w-[550px] drop-shadow-2xl" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 210 Q 150 200, 220 150 Q 300 100, 420 110 L 520 170 Q 580 190, 580 230 L 50 230 Z" fill="#2A3E5C" opacity="0.3"/>
                        <path d="M100 200 L 170 130 L 380 130 L 500 180 L 560 195 L 560 220 L 70 220 Z" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>
                        <circle cx="160" cy="220" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
                        <circle cx="460" cy="220" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
                        
                        <!-- Fren Servosu Vurgusu -->
                        <g transform="translate(230, 60)">
                            <rect x="10" y="30" width="35" height="65" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
                            <circle cx="75" cy="62" r="42" fill="#334155" stroke="#94A3B8" stroke-width="5"/>
                            <circle cx="75" cy="62" r="32" fill="#1E293B"/>
                            <rect x="117" y="56" width="40" height="12" fill="#94A3B8" rx="2"/>
                            
                            <!-- Rozet -->
                            <rect x="18" y="-15" width="115" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
                            <text x="32" y="2" fill="#FFFFFF" font-size="10" font-weight="bold">100% GARANTİLİ</text>
                        </g>
                    </svg>
                </div>
            </div>

        </section>

        <!-- 3. İKONLU ŞERİT -->
        <div class="bg-customGray border-b border-gray-300 px-4 py-2.5 flex flex-wrap justify-around items-center text-[11px] font-extrabold text-navy-800 uppercase tracking-wider gap-2">
            <div class="flex items-center gap-2">
                <i class="fa-regular fa-circle-check text-base"></i>
                <span>ORİJ
