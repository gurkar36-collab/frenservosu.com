<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com - powered by xparca.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #e5edf5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
            min-height: 100vh;
        }

        .container {
            width: 1000px;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        /* HEADER */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-x-gear {
            position: relative;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-x-gear i.fa-gear {
            font-size: 28px;
            color: #1b365d;
        }

        .logo-x-gear i.fa-xmark {
            position: absolute;
            font-size: 18px;
            color: #f39c12;
            font-weight: bold;
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
        }

        .main-logo-text {
            font-size: 20px;
            font-weight: 900;
            color: #11294a;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .sub-logo-text {
            font-size: 10px;
            color: #666;
            font-weight: bold;
            margin-top: 2px;
        }

        .sub-logo-text span {
            color: #11294a;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 18px;
        }

        .nav-menu a {
            text-decoration: none;
            color: #2c3e50;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .nav-menu a i {
            margin-right: 4px;
        }

        .user-menu {
            display: flex;
            gap: 12px;
            font-size: 11px;
            font-weight: 800;
            color: #11294a;
            align-items: center;
        }

        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* HERO BANNER */
        .hero-banner {
            background: linear-gradient(135deg, #091a30 0%, #102e54 50%, #1a4175 100%);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            position: relative;
            min-height: 340px;
        }

        .search-sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }

        /* Şasi No Box */
        .chassis-box {
            background-color: #0b1a2e;
            border: 1px solid #1e3a63;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .chassis-title {
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .chassis-input-wrapper {
            display: flex;
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            padding: 2px;
        }

        .chassis-input-wrapper input {
            border: none;
            outline: none;
            padding: 6px 8px;
            flex: 1;
            font-size: 10px;
            color: #333;
        }

        .btn-bul {
            background: linear-gradient(to bottom, #f39c12, #d68910);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-weight: 800;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
        }

        /* Vehicle Selector Box */
        .vehicle-box {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 10px;
        }

        .vehicle-box-title {
            font-size: 10px;
            font-weight: 800;
            color: #222;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .select-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .select-item {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            background: #fdfdfd;
        }

        .select-item i {
            color: #11294a;
            font-size: 12px;
            width: 20px;
        }

        .select-item select {
            border: none;
            outline: none;
            width: 100%;
            font-size: 10px;
            color: #555;
            font-weight: 600;
            background: transparent;
        }

        /* Visual Right Area */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .car-graphic {
            width: 100%;
            max-width: 550px;
            height: auto;
            object-fit: contain;
        }

        /* FEATURES BAR */
        .features-bar {
            background-color: #eaeff4;
            display: flex;
            justify-content: space-around;
            padding: 8px 10px;
            border-bottom: 1px solid #d5dfeb;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 800;
            color: #11294a;
        }

        .feature-item i {
            font-size: 14px;
        }

        /* CATEGORY GRID */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 12px;
            background-color: #ffffff;
        }

        .cat-card {
            border: 1px solid #e1e8f0;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 110px;
        }

        .cat-card-title {
            font-size: 9px;
            font-weight: 800;
            color: #11294a;
            margin-bottom: 4px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .cat-card img {
            max-width: 70px;
            max-height: 60px;
            object-fit: contain;
        }

            flex-direction: column;
