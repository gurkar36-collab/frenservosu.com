<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frenservosu.com - Yedek Parça</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ffffff; color: #333; }
        
        /* En Üst Header Menü Bölümü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .logo-area { font-size: 22px; font-weight: bold; color: #11294a; display: flex; align-items: center; gap: 5px; }
        .logo-area span { color: #ff8800; }
        .top-nav { display: flex; gap: 20px; list-style: none; font-weight: 600; color: #555; }
        .top-nav li { cursor: pointer; }
        .top-nav li:hover { color: #ff8800; }
        .user-menu { display: flex; gap: 15px; font-weight: bold; color: #222; }

        /* Ana Görsel Alanı (Hero Section) */
        .hero-section {
            background: radial-gradient(circle at 70% 50%, #1a3c61 0%, #0b1a2e 100%);
            padding: 50px 8%;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .hero-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Sol Bölüm: Arama ve Seçim Formları */
        .left-panel { width: 440px; z-index: 5; }

        /* 1. Şasi No Arama Kutusu */
        .shasi-box {
            background: #163252;
            border: 1px solid #224975;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .shasi-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        .shasi-input-wrapper { display: flex; background: #fff; border-radius: 6px; padding: 4px; }
        .shasi-input-wrapper input {
            flex: 1; border: none; padding: 10px; font-size: 13px; outline: none; border-radius: 4px;
        }
        .shasi-btn {
            background: #ff8800; color: white; border: none; padding: 0 25px;
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .shasi-btn:hover { background: #e07700; }

        /* 2. Aracınızı Seçin Menüsü */
        .filter-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .filter-card-title {
            font-size: 14px; font-weight: bold; color: #11294a;
            margin-bottom: 15px; border-left: 4px solid #ff8800; padding-left: 8px;
        }
        .select-group { margin-bottom: 12px; position: relative; }
        .select-group select {
            width: 100%; padding: 11px 15px; border: 1px solid #dcdcdc;
            border-radius: 6px; background: #fdfdfd; color: #444;
            font-size: 14px; outline: none; cursor: pointer; appearance: none;
        }
        .select-group::after {
            content: '▼'; font-size: 10px; color: #aaa; position: absolute; right: 15px; top: 16px; pointer-events: none;
        }

        /* Sağ Bölüm: Efektli Araba ve Parça Görseli */
        .right-panel {
            flex: 1; position: relative; display: flex; justify-content: flex-end; align-items: center;
        }
        /* Temsili Şık Araba Görseli */
        .car-img {
            width: 100%; max-width: 620px; height: auto;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            z-index: 1;
        }
        /* Havada Duran Parlayan Parça Efekti */
        .floating-part-container {
            position: absolute; left: 10%; top: -10%; z-index: 3;
            animation: floatAnim 4s ease-in-out infinite;
        }
        .servo-img {
            width: 180px; height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 255, 234, 0.6));
        }
        /* Mavi Parlama Halkası */
        .glow-ring {
            position: absolute; width: 220px; height: 220px;
            border: 2px dashed rgba(0, 255, 234, 0.4); border-radius: 50%;
            left: -20px; top: -20px; animation: spin 20s linear infinite;
        }
        /* %100 Uyumluluk Rozeti */
        .badge-100 {
            position: absolute; right: 10%; top: 10%; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px;
            border-radius: 30px; color: #fff; font-size: 12px; font-weight: bold; z-index: 4;
        }

        /* Alt Bilgi Çubuğu (Avantajlar) */
        .features-bar {
            display: flex; justify-content: space-around; background: #f8fbc2;
            background: #f4f7fc; padding: 20px 8%; border-bottom: 1px solid #e2e8f0;
        }
        .feature-item { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; color: #34495e; }
        .feature-icon { font-size: 20px; }

        /* Animasyon Tanımları */
        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes spin { 100% { transform: rotate(30deg); } }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <header>
        <div class="logo-area">⚙️ fren<span>servosu</span>.com</div>
        <ul class="top-nav">
            <li>KATEGORİLER</li>
            <li>MARKALAR</li>
            <li>AVANTAJLARA BAKIŞ</li>
            <li>BLOG</li>
            <li>İLETİŞİM</li>
        </ul>
        <div class="user-menu">👤 HESABIM | 🛒 SEPETİM</div>
    </header>

    <!-- Ana Ekran -->
    <section class="hero-section">
        <div class="hero-container">
            
            <!-- Sol Panel: Formlar -->
            <div class="left-panel">
                <!-- Şasi No Sorgulama -->
                <div class="shasi-box">
                    <div class="shasi-title">Şasi No ile Fren Servosu Ara</div>
                    <div class="shasi-input-wrapper">
                        <input type="text" placeholder="Aracınızın 17 haneli Şasi Numarasını (VIN) giriniz...">
                        <button class="shasi-btn">BUL</button>
                    </div>
                </div>

                <!-- Adım Adım Araç Filtresi -->
                <div class="filter-card">
                    <div class="filter-card-title">ARACINIZI SEÇİN</div>
                    <div class="select-group">
                        <select><option>1. Marka</option></select>
                    </div>
                    <div class="select-group">
                        <select disabled><option>2. Model Seçin...</option></select>
                    </div>
                    <div class="select-group">
                        <select disabled><option>3. Yıl</option></select>
                    </div>
                    <div class="select-group">
                        <select disabled><option>4. Motor Seçin...</option></select>
                    </div>
                    <div class="select-group">
                        <select disabled><option>5. Şanzıman</option></select>
                    </div>
                </div>
            </div>

            <!-- Sağ Panel: Araba ve Havada Duran Parça Grafiği -->
            <div class="right-panel">
                <div class="badge-100">✓ %100 UYUMLULUK GARANTİSİ</div>
                
                <!-- Havada parlayan mekanik parça alanı -->
                <div class="floating-part-container">
                    <div class="glow-ring"></div>
                    <img src="https://unsplash.com" class="servo-img" alt="Fren Parçası">
                </div>

                <!-- Modern Araba Görseli -->
                <img src="https://unsplash.com" class="car-img" alt="Araç">
            </div>

        </div>
    </section>

    <!-- Alt İkonlu Bilgi Barı -->
    <div class="features-bar">
        <div class="feature-item"><span class="feature-icon">🛡️</span> ORİJİNAL VE GARANTİLİ ÜRÜNLER</div>
        <div class="feature-item"><span class="feature-icon">🚚</span> HIZLI VE ÜCRETSİZ KARGO</div>
        <div class="feature-item"><span class="feature-icon">👨‍🔧</span> UZMAN TEKNİK DESTEK</div>
        <div class="feature-item"><span class="feature-icon">🔄</span> KOLAY İADE</div>
    </div>

</body>
</html>
